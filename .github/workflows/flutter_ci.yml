name: Flutter CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Bootstrap Android when missing
        if: ${{ hashFiles('android/app/build.gradle.kts') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          preserve=(
            pubspec.yaml
            analysis_options.yaml
            README.md
            .gitignore
            .env.example
            lib
            test
            docs
            config
            supabase
            .github
            tool
          )

          for item in "${preserve[@]}"; do
            if [ -e "$item" ]; then
              cp -a "$item" "$tmp/"
            fi
          done

          flutter create --platforms=android --org com.snapgym --project-name snapgym .

          for item in "${preserve[@]}"; do
            if [ -e "$tmp/$item" ]; then
              rm -rf "$item"
              cp -a "$tmp/$item" "$item"
            fi
          done

          rm -rf "$tmp"

      - name: Configure Android flavors
        run: python3 tool/configure_android_flavors.py

      - name: Decode stable dev signing key
        run: base64 --decode android/app/dev-signing.jks.b64 > android/app/dev-signing.jks

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags preview

      - name: Generate UI previews
        run: |
          flutter test test/competition_preview_test.dart --update-goldens
          mkdir -p build/previews
          cp test/goldens/competition-ranking.png build/previews/
          cp test/goldens/competition-challenges.png build/previews/

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: snapgym-ui-previews
          path: build/previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Persist generated Flutter files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android .metadata pubspec.lock lib test
          if ! git diff --cached --quiet; then
            git commit -m "chore: normalize generated Flutter files"
            git push
          fi

      - name: Build Android dev release APK
        timeout-minutes: 12
        run: >-
          flutter build apk --release --flavor dev -t lib/main_dev.dart
          --dart-define-from-file=config/dev.json

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: snapgym-dev-release-apk
          path: build/app/outputs/flutter-apk/app-dev-release.apk
          if-no-files-found: error
          retention-days: 14
