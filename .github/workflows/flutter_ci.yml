name: Flutter CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Bootstrap Android when missing
        if: ${{ hashFiles('android/app/build.gradle.kts') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          preserve=(
            pubspec.yaml
            analysis_options.yaml
            README.md
            .gitignore
            .env.example
            lib
            test
            docs
            config
            supabase
            .github
            tool
          )

          for item in "${preserve[@]}"; do
            if [ -e "$item" ]; then
              cp -a "$item" "$tmp/"
            fi
          done

          flutter create --platforms=android --org com.snapgym --project-name snapgym .

          for item in "${preserve[@]}"; do
            if [ -e "$tmp/$item" ]; then
              rm -rf "$item"
              cp -a "$tmp/$item" "$item"
            fi
          done

          rm -rf "$tmp"

      - name: Configure Android flavors
        run: python3 tool/configure_android_flavors.py

      - name: Decode stable dev signing key
        run: base64 --decode android/app/dev-signing.jks.b64 > android/app/dev-signing.jks

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test tool/competition_preview.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags preview

      - name: Generate readable UI previews
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=web --org com.snapgym --project-name snapgym .
          flutter build web --release -t tool/competition_preview.dart

          mkdir -p build/previews
          python3 -m http.server 8080 --directory build/web >/tmp/snapgym-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"

          "$chrome" --headless=new --no-sandbox --hide-scrollbars \
            --window-size=390,844 --force-device-scale-factor=2 \
            --run-all-compositor-stages-before-draw --virtual-time-budget=5000 \
            --screenshot=build/previews/competition-ranking.png \
            'http://127.0.0.1:8080/?section=ranking'

          "$chrome" --headless=new --no-sandbox --hide-scrollbars \
            --window-size=390,844 --force-device-scale-factor=2 \
            --run-all-compositor-stages-before-draw --virtual-time-budget=5000 \
            --screenshot=build/previews/competition-challenges.png \
            'http://127.0.0.1:8080/?section=challenges'

          test -s build/previews/competition-ranking.png
          test -s build/previews/competition-challenges.png

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: snapgym-ui-previews
          path: build/previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Persist generated Flutter files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android .metadata pubspec.lock lib test
          if ! git diff --cached --quiet; then
            git commit -m "chore: normalize generated Flutter files"
            git push
          fi

      - name: Build Android dev release APK
        timeout-minutes: 12
        run: >-
          flutter build apk --release --flavor dev -t lib/main_dev.dart
          --dart-define-from-file=config/dev.json

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: snapgym-dev-release-apk
          path: build/app/outputs/flutter-apk/app-dev-release.apk
          if-no-files-found: error
          retention-days: 14
