name: Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database_tests.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - ".github/workflows/database_tests.yml"

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Initialize local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start local Supabase
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db supabase/tests/database

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
