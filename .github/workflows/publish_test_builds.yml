name: Publish Test Builds

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "config/dev.json"
      - "supabase/functions/publish-app-update/**"
      - ".github/workflows/publish_test_builds.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: snapgym-test-release
  cancel-in-progress: true

jobs:
  android:
    name: Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Decode stable dev signing key
        run: base64 --decode android/app/dev-signing.jks.b64 > android/app/dev-signing.jks

      - name: Dependencies
        run: flutter pub get

      - name: Build dev release APK
        run: >-
          flutter build apk --release --flavor dev -t lib/main_dev.dart
          --dart-define-from-file=config/dev.json

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-dev-release.apk SnapGym-Android-dev.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapgym-android-test
          path: SnapGym-Android-dev.apk
          if-no-files-found: error
          retention-days: 30

  ios-simulator:
    name: iOS Simulator test build
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Generate iOS project
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          preserve=(
            pubspec.yaml
            analysis_options.yaml
            README.md
            .gitignore
            .env.example
            lib
            test
            docs
            config
            supabase
            .github
            tool
          )

          for item in "${preserve[@]}"; do
            if [ -e "$item" ]; then
              cp -a "$item" "$tmp/"
            fi
          done

          flutter create --platforms=ios --org com.snapgym --project-name snapgym .

          for item in "${preserve[@]}"; do
            if [ -e "$tmp/$item" ]; then
              rm -rf "$item"
              cp -a "$tmp/$item" "$item"
            fi
          done

          rm -rf "$tmp"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string SnapGym uses the camera to register workout evidence." ios/Runner/Info.plist || true

      - name: Dependencies
        run: flutter pub get

      - name: Build iOS Simulator app
        run: >-
          flutter build ios --simulator --debug -t lib/main_dev.dart
          --dart-define-from-file=config/dev.json

      - name: Package iOS Simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app SnapGym-iOS-Simulator-dev.app.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapgym-ios-simulator-test
          path: SnapGym-iOS-Simulator-dev.app.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish test release and updater
    needs: [android, ios-simulator]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: snapgym-android-test
          path: release-assets

      - name: Download iOS build
        uses: actions/download-artifact@v4
        with:
          name: snapgym-ios-simulator-test
          path: release-assets

      - name: Create release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## SnapGym — Test Build v${VERSION_NAME} (${BUILD_NUMBER})

          ### Incluído
          - verificação automática de versão ao abrir o aplicativo
          - aviso quando uma versão mais recente está disponível
          - download do APK dentro do próprio SnapGym no Android
          - verificação SHA-256 antes da instalação
          - abertura do instalador oficial do Android após o download
          - chave de assinatura estável exclusiva do flavor DEV, permitindo atualizar o APK sem reinstalar nas próximas versões
          - permissões de sideload restritas ao flavor DEV
          - publicação segura do APK no Supabase Storage usando GitHub OIDC, sem segredo do Supabase no repositório

          ### Android
          **SnapGym-Android-dev.apk** é um APK release de desenvolvimento e pode ser instalado em aparelho real.

          Na primeira instalação desta nova linha de assinatura, remova builds antigos do SnapGym DEV. Depois disso, versões futuras assinadas com a mesma chave poderão atualizar a instalação existente.

          ### iOS
          **SnapGym-iOS-Simulator-dev.app.zip** permanece destinado ao iOS Simulator. Em aparelhos reais, updates futuros serão direcionados por TestFlight/App Store, conforme as regras da Apple.
          EOF

      - name: Publish Android updater binary
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          PUBLISH_ENDPOINT: https://zsnsxodhpnffcnippzkv.supabase.co/functions/v1/publish-app-update
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/release-assets/SnapGym-Android-dev.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          UPDATE_NOTES="Atualização ${VERSION_NAME}: sistema de atualização automática e melhorias da versão de teste."

          get_oidc_token() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=snapgym-update-publisher" \
              | jq -r '.value'
          }

          OIDC_TOKEN="$(get_oidc_token)"
          PREPARE_BODY="$(jq -n \
            --arg version "$VERSION_NAME" \
            --argjson build "$BUILD_NUMBER" \
            --arg sha256 "$APK_SHA256" \
            --arg notes "$UPDATE_NOTES" \
            '{action:"prepare",version:$version,build:$build,sha256:$sha256,release_notes:$notes}')"

          PREPARE_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "$PUBLISH_ENDPOINT" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PREPARE_BODY")"

          SIGNED_URL="$(printf '%s' "$PREPARE_RESPONSE" | jq -r '.signed_url')"
          if [ -z "$SIGNED_URL" ] || [ "$SIGNED_URL" = "null" ]; then
            echo "Update publisher did not return a signed upload URL."
            exit 1
          fi

          echo "Uploading updater APK through short-lived signed URL..."
          curl --fail-with-body --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -X PUT "$SIGNED_URL" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Cache-Control: max-age=3600" \
            -H "x-upsert: true" \
            --upload-file "$APK" \
            --output /dev/null

          OIDC_TOKEN="$(get_oidc_token)"
          FINALIZE_BODY="$(jq -n \
            --arg version "$VERSION_NAME" \
            --argjson build "$BUILD_NUMBER" \
            --arg sha256 "$APK_SHA256" \
            --arg notes "$UPDATE_NOTES" \
            '{action:"finalize",version:$version,build:$build,sha256:$sha256,release_notes:$notes}')"

          curl --fail-with-body --silent --show-error \
            -X POST "$PUBLISH_ENDPOINT" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$FINALIZE_BODY" \
            | jq .

      - name: Publish or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="test-v${VERSION_NAME}"
          TITLE="SnapGym Test Build v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
